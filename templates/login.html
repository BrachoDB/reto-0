{% extends "base.html" %}
{% block title %}Iniciar sesión · Agenda Clara{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="eyebrow">QUÉ BUENO VERTE</p>
  <h1>Inicia sesión</h1>
  <p class="muted">Accede a tu agenda personal.</p>
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="email">Correo electrónico</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button class="button primary full" type="submit">Entrar a mi agenda</button>
  </form>
  <p class="auth-switch">¿Aún no tienes cuenta? <a href="{{ url_for('register') }}">Crea una aquí</a></p>
</section>
{% endblock %}
