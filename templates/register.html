{% extends "base.html" %}
{% block title %}Crear cuenta · Agenda Clara{% endblock %}
{% block content %}
<section class="auth-card">
  <p class="eyebrow">EMPIEZA TU AGENDA</p>
  <h1>Crea tu cuenta</h1>
  <p class="muted">Tu información será privada y solo tú podrás verla.</p>
  <form method="post" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="email">Correo electrónico</label>
    <input id="email" name="email" type="email" autocomplete="email" required>
    <label for="password">Contraseña</label>
    <input id="password" name="password" type="password" autocomplete="new-password" minlength="10" required>
    <small>Usa al menos 10 caracteres.</small>
    <button class="button primary full" type="submit">Crear cuenta</button>
  </form>
  <p class="auth-switch">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p>
</section>
{% endblock %}
